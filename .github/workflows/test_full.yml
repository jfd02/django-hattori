name: Full Test

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [assigned, opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.14']
        django-version: ['<5.3', '<6.1']

    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync
        run: uv sync
      - name: Pin Django ${{ matrix.django-version }}
        run: uv pip install "Django${{ matrix.django-version }}"
      - name: Test
        run: uv run --no-sync pytest

  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - name: Test
        run: uv run pytest --cov=hattori

  codestyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - name: Ruff format
        run: uv run ruff format --check hattori tests
      - name: Ruff lint
        run: uv run ruff check hattori tests
      - name: mypy
        run: uv run mypy hattori tests/mypy_test.py
