[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[project]
name = "django-hattori"
version = "1.5.3"
description = "Fast Django REST framework"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jfd02" }]
classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Typing :: Typed",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "Django>=5.2,<6.1",
    "pydantic>=2.7,<3.0.0",
    "orjson>=3.10",
]

[project.urls]
Homepage = "https://github.com/jfd02/django-hattori"
Repository = "https://github.com/jfd02/django-hattori"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-django",
    "pytest-asyncio",
    "psycopg2-binary",
    "django-stubs",
    "mypy>=1.15",
    "ruff>=0.14",
    "pre-commit",
]

[tool.uv.build-backend]
module-name = "hattori"
module-root = ""

[tool.ruff]
target-version = "py314"

[tool.ruff.format]
preview = true

[tool.ruff.lint]
preview = true
select = [
    "B",    # flake8-bugbear
    "C",    # flake8-comprehensions
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "FURB", # refurb
    "I",    # isort
    "PTH",  # flake8-use-pathlib
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "E501",    # line too long, handled by the formatter
    "B008",    # do not perform function calls in argument defaults
    "C901",    # too complex
    "B903",    # class could be a dataclass/namedtuple — stylistic, not always desirable
    "UP042",   # str+Enum -> StrEnum — changes serialization semantics; kept intentional
    "UP046",   # PEP 695 generic classes — these rely on __orig_bases__ introspection
    "FURB189", # subclassing dict/str — PatchDict and friends do this by design
]

[tool.ruff.lint.per-file-ignores]
"hattori/compatibility/datastructures.py" = ["C416"]
"hattori/utils.py" = ["B004"]
"tests/*" = ["C408", "B017"]

[tool.coverage.run]
omit = ["hattori/compatibility/*"]
branch = true

[tool.coverage.report]
# Was 100% when the docs shipped example-snippet tests; those were removed with
# the docs, so the floor reflects the suite's current coverage of hattori.
fail_under = 94
skip_covered = true
show_missing = true
